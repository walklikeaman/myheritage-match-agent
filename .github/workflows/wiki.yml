name: Wiki

on:
  push:
    paths: ["wiki/**", "tests/test_wiki.py", "docs/**"]
  pull_request:
    paths: ["wiki/**", "tests/test_wiki.py", "docs/**"]

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - run: python3 -m pytest -q tests/test_wiki.py
